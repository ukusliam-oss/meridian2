<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Design lab | Meridian</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  /* candidates under test (design plan §9.1): the display serif at three weights, and two UI faces */
  @font-face { font-family: "Disp 330"; src: url(../assets/fonts/noto-serif-display-330.woff2) format("woff2"); }
  @font-face { font-family: "Disp 330"; font-style: italic; src: url(../assets/fonts/noto-serif-display-330-italic.woff2) format("woff2"); }
  @font-face { font-family: "Disp 350"; src: url(../assets/fonts/noto-serif-display-350.woff2) format("woff2"); }
  @font-face { font-family: "Disp 350"; font-style: italic; src: url(../assets/fonts/noto-serif-display-350-italic.woff2) format("woff2"); }
  @font-face { font-family: "Disp 400"; src: url(../assets/fonts/noto-serif-display-400.woff2) format("woff2"); }
  @font-face { font-family: "Disp 400"; font-style: italic; src: url(../assets/fonts/noto-serif-display-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "Archivo Expanded"; src: url(../assets/fonts/archivo-expanded-500.woff2) format("woff2"); font-weight: 500; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; }
  .stage { position: fixed; inset: 0; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  :root { --ink-ui: #212529; --disp: "Disp 330"; --ui-font: var(--mono); }
  .dark { --ink-ui: #ece9e1; }
  .f { position: fixed; z-index: 2; color: var(--ink-ui); font: 500 12px/1.2 var(--ui-font); letter-spacing: .06em; text-transform: uppercase; }
  .f--tl { left: var(--frame); top: var(--frame); }
  .f--tr { right: var(--frame); top: var(--frame); }
  .f--br { right: var(--frame); bottom: var(--frame); }
  .f--tc { left: 50%; top: calc(var(--frame) - 4px); transform: translateX(-50%); text-align: center; font: 24px/1 var(--disp); letter-spacing: 0; text-transform: none; }
  .f--tc small { display: block; margin-top: 8px; font: 500 12px/1 var(--ui-font); letter-spacing: .06em; text-transform: uppercase; }
  .f--parts { right: var(--frame); top: 50%; transform: translateY(-50%); display: grid; gap: 12px; }
  .f--parts span { width: 32px; height: 32px; border-radius: 50%; border: .65px solid currentColor; display: grid; place-items: center; font: 18px/1 var(--disp); letter-spacing: 0; opacity: .2; }
  .f--parts span.on { opacity: 1; }
  /* the title lock-up, with Cartier's proportions (C = capital height): italic 0.7em, centred on the capitals,
     0.24C apart, line pitch 1.28C, the second line flush right; the label 0.275C, 0.69C below, centred */
  .lock { position: fixed; z-index: 2; left: 50%; bottom: 40px; transform: translateX(-50%); color: var(--ink-ui); text-align: center; }
  .lock__t { font-family: var(--disp); font-weight: 400; line-height: 1; width: max-content; font-size: var(--fs, min(11.15vw, 19.82svh)); }
  .lock__l { display: flex; align-items: center; gap: .17em; }
  .lock__l + .lock__l { justify-content: flex-end; margin-top: .2em; }
  .lock__t i { font-size: .7em; }
  .lock__lab { margin-top: .5em; font: 400 max(12px, calc(var(--fsn, 160px) * .195)) / 1 var(--disp); letter-spacing: .02em; }
  @media (max-width: 760px) { .f--parts { display: none; } }
  .ctl { position: fixed; z-index: 3; left: 50%; top: 64px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 92vw; }
  .ctl button, .ctl label { font: 500 11px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 7px 10px; border-radius: 999px; border: 1px solid rgb(128 128 128 / .4); background: rgb(128 128 128 / .14); color: var(--ink-ui); cursor: pointer; }
  .ctl input { vertical-align: middle; }
  .clean .ctl { display: none; }
  .w { display: inline-block; }
</style>
</head>
<body>
<div class="stage" data-stage></div>
<div class="f f--tl" data-ui>≡ Menu</div>
<div class="f f--tc" data-ui><span data-wordmark>Meridian</span><small data-presents>History · 0470</small></div>
<div class="f f--tr" data-ui>History ×</div>
<div class="f f--parts" data-ui><span class="on">I</span><span>II</span><span>III</span><span>IV</span><span>V</span><span>VI</span><span>VII</span></div>
<div class="f f--br" data-ui>Sound</div>
<div class="lock" data-lock><div class="lock__t" data-title><div class="lock__l"><i>Behind the</i><span>IRON</span></div><div class="lock__l"><span>CURTAIN</span></div></div><div class="lock__lab" data-label>KEY QUESTION VI</div></div>
<div class="ctl" data-ctl>
  <button data-act="overture">Play overture</button>
  <button data-act="font">Font: 330</button>
  <button data-act="ui">UI: Plex Mono</button>
  <button data-act="subject">Ink: History</button>
  <button data-act="dark">Paper: white</button>
  <label>Bloom <input type="range" min="0" max="1.4" step=".01" value="0.85" data-range="bloom"></label>
  <label>Flood <input type="range" min="0" max="1" step=".005" value="0" data-range="flood"></label>
</div>
<script src="../assets/vendor/gsap.min.js"></script><script src="../assets/vendor/ScrollTrigger.min.js"></script><script src="../assets/vendor/SplitText.min.js"></script><script src="../assets/vendor/Flip.min.js"></script><script src="../assets/vendor/DrawSVGPlugin.min.js"></script><script src="../assets/vendor/CustomEase.min.js"></script>
<script type="module">
import { gsap } from '../assets/js/core.js';
import { words, blurIn, blurOut, hold, DUR } from '../assets/js/motion.js';
import { createLab } from '../assets/js/design-lab.js';

// lab.html?font=330|350|400|inst&ui=plex|archivo&subject=history|economics|geography&dark=1&bloom=1.06&flood=0&clean=1
const q = new URLSearchParams(location.search);
const INK = { history: '#6d3fd0', economics: '#0f7a58', geography: '#1f5fae' };
const FONTS = ['330', '350', '400', 'inst'];
const st = { font: q.get('font') || '330', ui: q.get('ui') || 'plex', subject: q.get('subject') || 'history', dark: q.get('dark') === '1' };
const $ = s => document.querySelector(s), root = document.documentElement;
if (q.get('clean') === '1') root.classList.add('clean');
const lab = createLab($('[data-stage]'), { dark: st.dark, ink: INK[st.subject] });
window.__lab = lab;

const title = $('[data-title]'), lock = $('[data-lock]');
function apply() {
  root.style.setProperty('--disp', st.font === 'inst' ? '"Instrument Serif"' : `"Disp ${st.font}"`);
  root.style.setProperty('--ui-font', st.ui === 'archivo' ? '"Archivo Expanded"' : 'var(--mono)');
  root.classList.toggle('dark', st.dark);
  lab.dark = st.dark; lab.ink = INK[st.subject];
  $('[data-act="font"]').textContent = 'Font: ' + st.font; $('[data-act="ui"]').textContent = 'UI: ' + (st.ui === 'archivo' ? 'Archivo' : 'Plex Mono');
  $('[data-act="subject"]').textContent = 'Ink: ' + st.subject; $('[data-act="dark"]').textContent = 'Paper: ' + (st.dark ? 'black' : 'white');
  fit();
}
// the block is at most 40% of the screen wide (Cartier 39.7%); a longer title is set smaller
function fit() {
  title.style.removeProperty('--fs');
  const w = title.getBoundingClientRect().width, max = innerWidth * (innerWidth < innerHeight ? .86 : .40);
  const fs = parseFloat(getComputedStyle(title).fontSize) * Math.min(1, max / w);
  title.style.setProperty('--fs', fs + 'px'); lock.style.setProperty('--fsn', fs + 'px');
  // the globe sits in the upper middle, the title in the lower third (Cartier: the stones at 33–50%, the title 73–91%)
  const r = Math.min(innerWidth, innerHeight) * .12;
  lab.object(innerWidth / 2, innerHeight * .34, r);
}
await document.fonts.ready;
apply();
lab.bloom = +(q.get('bloom') ?? 0.85); lab.flood = +(q.get('flood') ?? 0);

// the overture (plan §5.2), on paper: the title is born in the middle at 1.5×, its words sharpen in a random order,
// then at 1.75 s it glides home over 2 s while the ink blooms around the globe on the same curve
const ws = words(title);
function overture() {
  const ui = document.querySelectorAll('[data-ui]'), lab2 = $('[data-label]'), pres = $('[data-presents]'), mark = $('[data-wordmark]');
  gsap.set([...ui, lab2], { opacity: 0 }); gsap.set(pres, { opacity: 1 });
  const g = hold(title.parentElement, { scale: 1.5 });
  const ink = { k: 0 };
  lab.bloom = 0;
  const tl = gsap.timeline();
  tl.add(blurIn(ws), 0.5)
    .set(ui[1], { opacity: 1 }, 0.9).fromTo(mark, { scale: 2, y: 18 }, { scale: 1, y: 0, duration: DUR.stage, ease: 'm.smooth' }, 1.75)
    .fromTo(pres, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'none' }, 1.75)
    .add(() => g.play(), 1.75)
    .to(ink, { k: 0.85, duration: DUR.stage, ease: 'm.smooth', onUpdate: () => { lab.bloom = ink.k; } }, 1.75)
    .add(blurIn(lab2, { dur: 0.8, shuffle: false }), 1.8)
    .add(blurIn([ui[0], ui[3], ui[2], ui[4]], { dur: 0.6, stagger: 0.15, shuffle: false }), 2.2);
  return tl;
}
window.__overture = overture;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'overture') overture();
  if (a === 'font') st.font = FONTS[(FONTS.indexOf(st.font) + 1) % FONTS.length];
  if (a === 'ui') st.ui = st.ui === 'plex' ? 'archivo' : 'plex';
  if (a === 'subject') { const k = Object.keys(INK); st.subject = k[(k.indexOf(st.subject) + 1) % k.length]; }
  if (a === 'dark') st.dark = !st.dark;
  if (a !== 'overture') apply();
});
document.querySelectorAll('[data-range]').forEach(r => r.addEventListener('input', () => { lab[r.dataset.range] = +r.value; }));
addEventListener('resize', fit);
document.title = 'ready';
</script>
</body>
</html>
